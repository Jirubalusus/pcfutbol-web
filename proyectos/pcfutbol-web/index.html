  <body>
    <div id="root"></div>
    <script>
      // Force-clear old PWA/service-worker caches before the app module starts.
      // This prevents mobile browsers from keeping stale lazy chunks like ProManagerSetup.
      (function clearStalePwaCache() {
        // Current cache marker: mundial-draft-premium-cards-20260607
        var version = 'mundial-draft-premium-cards-20260607';
        var reloadKey = 'pcgaffer-cache-reset-' + version;
        var tasks = [];

        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations()
              .then(function(regs) { return Promise.all(regs.map(function(r) { return r.unregister(); })); })
          );
        }

        if ('caches' in window) {
          tasks.push(
            caches.keys()
              .then(function(names) { return Promise.all(names.map(function(n) { return caches.delete(n); })); })
          );
        }

        if (!tasks.length) return;
        Promise.all(tasks).then(function() {
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            // Preserve existing query params (e.g. ?qa=...); only set/replace the
            // cache-busting `v` marker so a stale install reloads onto fresh chunks.
            var params = new URLSearchParams(window.location.search);
            params.set('v', version);
            var cleanPath = window.location.pathname || '/';
            window.location.replace(cleanPath + '?' + params.toString());
          }
        }).catch(function() {});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
