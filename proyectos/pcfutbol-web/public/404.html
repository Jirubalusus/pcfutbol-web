<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página no encontrada — PC Gaffer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(0, 212, 255, 0.14), transparent 34%), #0c0f14;
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    main {
      width: min(520px, 100%);
      padding: 32px 24px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 24px;
      background: rgba(15, 20, 25, 0.86);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .ball { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: 0.05em; margin-bottom: 12px; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #00111a;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="ball" aria-hidden="true">⚽</div>
    <h1>404</h1>
    <p>La página que buscas no existe o ha cambiado de dirección. Vuelve al vestuario principal de PC Gaffer.</p>
    <a href="/">Volver a PC Gaffer</a>
  </main>
</body>
</html>
